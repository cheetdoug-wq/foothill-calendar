<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Cheet's Press joke post 2</title>
<!-- Second Instagram still: a lock screen full of the dog's calendar alerts.
     render-post.py post2 out.png -->
<style>
@font-face{font-family:"Bowlby One";src:url(/fonts/bowlby-one.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Figtree";src:url(/fonts/figtree-600.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Figtree";src:url(/fonts/figtree-700.woff2) format("woff2");font-weight:700}
@font-face{font-family:"Figtree";src:url(/fonts/figtree-800.woff2) format("woff2");font-weight:800 900}
html,body{margin:0;background:#000}
#card{width:540px;height:675px;box-sizing:border-box;position:relative;overflow:hidden;
  background:radial-gradient(130% 90% at 50% 6%,#3a1d6e 0%,#24123f 55%,#180c2c 100%);
  font-family:"Figtree",system-ui,sans-serif;color:#fbf4ff;padding:24px 22px 18px;
  display:flex;flex-direction:column;gap:12px}
header{flex:0 0 auto}
h1{margin:0;font:400 34px/1.06 "Bowlby One","Arial Black",sans-serif;letter-spacing:.3px}
h1 em{font-style:normal;color:#ff8a1f}
.sub{margin:8px 0 0;font:800 15px/1.25 "Figtree",sans-serif;color:#d6c6f2}
.screen{flex:1 1 auto;min-height:0;border-radius:20px;padding:14px 12px 12px;box-sizing:border-box;
  background:linear-gradient(#1a2440,#141a2e 55%,#10131f);box-shadow:0 16px 40px #0009,0 0 0 2px #4b2f7d;
  display:flex;flex-direction:column;gap:9px}
.clock{flex:0 0 auto;text-align:center;color:#fff}
.clock b{display:block;font:300 38px/1 "Figtree",system-ui,sans-serif;letter-spacing:-1px}
.clock span{display:block;font:700 12px/1 "Figtree",sans-serif;color:#aab4cf;margin-top:5px}
.notes{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px;justify-content:flex-end;overflow:hidden}
.n{background:rgba(238,242,252,.93);border-radius:11px;padding:6px 10px 7px;color:#141a2e;box-sizing:border-box}
.n .hd{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.n .hd i{width:11px;height:11px;border-radius:3px;background:#ff8a1f;flex:0 0 auto}
.n .hd b{font:800 9px/1 "Figtree",sans-serif;color:#5c6478;letter-spacing:.7px;flex:1 1 auto}
.n .hd em{font-style:normal;font:700 9px/1 "Figtree",sans-serif;color:#8891a6}
.n strong{display:block;font:800 13px/1.12 "Figtree",sans-serif;color:#121726}
.n span{display:block;font:700 10px/1.18 "Figtree",sans-serif;color:#5c6478;margin-top:1px}
.n.hot{background:#ffe2c0}
.n.hot strong{color:#8a3d00}
.n.hot span{color:#a8641f}
.foot{flex:0 0 auto;display:flex;align-items:center;gap:10px}
.foot svg{flex:0 0 auto;width:78px;height:48px;overflow:visible}
.foot .t{flex:1 1 auto;min-width:0}
.foot .t b{display:block;font:800 14.5px/1.2 "Figtree",sans-serif;color:#fff}
.foot .t span{display:block;font:700 12px/1.3 "Figtree",sans-serif;color:#cbb8ee;margin-top:2px}
.foot .tag{flex:0 0 auto;font:800 14px/1 "Figtree",sans-serif;color:#2a1300;background:#ff8a1f;padding:10px 13px;border-radius:999px}
</style></head>
<body>
<div id="card">
  <header>
    <h1>I gave my dog access<br>to <em>the calendar.</em></h1>
    <p class="sub">She has been extremely busy.</p>
  </header>
  <div class="screen">
    <div class="clock"><b>6:14</b><span>Thursday, November 5</span></div>
    <div class="notes" id="notes"></div>
  </div>
  <div class="foot">
    <svg id="cheet" viewBox="-80 -106 212 126" aria-hidden="true"></svg>
    <div class="t"><b>Yours can say anything you want.</b><span>Custom calendars · half year $8 · full year $12</span></div>
    <div class="tag">cheetspress.store</div>
  </div>
</div>
<script src="/src/scenes.js"></script>
<script>
var N = [
  ['4h ago', 'Dinner', 'You are four minutes late.', 0],
  ['3h ago', 'Sniff the entire fence', 'Every post. No skipping.', 0],
  ['1h ago', 'Nap', 'All-day event', 0],
  ['1h ago', 'Nap', 'All-day event', 0],
  ['2m ago', 'Bark at absolutely nothing', 'Repeats daily', 0],
  ['now', 'ZOOMIES', 'Starting now · Location: the whole house', 1]
];
document.getElementById('notes').innerHTML = N.map(function (x) {
  return '<div class="n' + (x[3] ? ' hot' : '') + '"><div class="hd"><i></i><b>CALENDAR</b><em>' + x[0] +
    '</em></div><strong>' + x[1] + '</strong><span>' + x[2] + '</span></div>';
}).join('');
(function () {
  var tmp = document.createElement('div'); tmp.innerHTML = CAL.scene(0, { uid: 'q' });
  var ch = tmp.querySelector('.pace'); ch.classList.remove('pace'); ch.removeAttribute('style');
  document.getElementById('cheet').appendChild(ch);
})();
window.POST_READY = true;
</script>
</body></html>
