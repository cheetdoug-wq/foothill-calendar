.obj{position:absolute;left:50%;top:238px;width:250px;height:250px;margin-left:-125px;opacity:0}

.stamp{position:absolute;left:50%;top:352px;width:156px;height:156px;margin-left:4px;opacity:0}
.walk{position:absolute;left:0;bottom:140px;width:344px;opacity:0}
.walk svg{width:100%;height:auto;display:block;overflow:visible}

      anim(p.querySelector('.beam'), [[g.t0 + 1.0, 'opacity:0;transform:translateY(40px)'], [g.t0 + 1.2, 'opacity:1;transform:translateY(40px)', 'ease-in-out'], [g.t0 + 2.4, 'opacity:1;transform:translateY(480px)', 'ease-in-out'], [g.t0 + 3.6, 'opacity:1;transform:translateY(40px)'], [g.t0 + 3.9, 'opacity:0;transform:translateY(40px)']]);
    } else {
      L = el('layer dark end',
        '<svg class="paw" viewBox="0 0 74 74" aria-hidden="true"><g fill="#6fa8ff"><ellipse cx="37" cy="48" rx="17" ry="14"/><ellipse cx="13" cy="33" rx="7" ry="9"/><ellipse cx="28" cy="18" rx="7" ry="10"/><ellipse cx="47" cy="18" rx="7" ry="10"/><ellipse cx="62" cy="33" rx="7" ry="9"/></g></svg>' +
        '<div class="logo">Cheet\'s <b>Press</b></div>' +

        '<div class="code">15% off with code <b>FLYER15</b></div>');
      [].forEach.call(L.children, function(c, j){ var t = g.t0 + .35 + j * .16; anim(c, [[t, 'opacity:0;transform:translateY(22px)', OUT], [t + .6, 'opacity:1;transform:none']]); });
    }
    show(L, g.t0, g.t1, first, last);
  });
  if (R.bar) { var b = el('bar', '<i></i>'); show(b, R.bar[0], R.bar[1], true, false); anim(b.firstChild, [[R.bar[0], 'transform:scaleX(0)'], [R.bar[1], 'transform:scaleX(1)']]); }
  document.getElementById('tl').textContent = css;
  /* render.py calls this to jump to an exact moment */
  window.REEL = { dur: D, sfx: R.sfx || [], seek: function(t){
    document.getAnimations().forEach(function(a){ a.pause(); a.currentTime = t * 1000; });
    document.querySelectorAll('svg.scene').forEach(function(s){ s.pauseAnimations(); s.setCurrentTime(t); });
  } };
})();
